<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080f1c"><title>观星者的清醒梦 · 星空原型</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./painted.css">
  <link rel="stylesheet" href="./motion.css">
</head>
<body data-variant="A">
  <section id="room" aria-label="深夜窗边，点击窗户进入星空" hidden>
    <div class="room-stage" id="room-stage">
      <picture><source media="(max-width:760px)" srcset="./assets/room-portrait-v11.png"><img class="room-image" src="./assets/room-poster-detail-v20.png" alt="暖黄色台灯下，戴耳机的人写着手记，窗外是蓝色云朵与弯月。" fetchpriority="high"></picture>
      <button id="window-entry" aria-label="穿过窗户，进入星空"></button>
      <svg class="window-invitation window-invitation-wide" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
        <defs><linearGradient id="window-light-wide" gradientUnits="userSpaceOnUse" x1="0" y1="700" x2="0" y2="90"><stop offset="0" stop-color="#c8dfec" stop-opacity="0"/><stop offset=".48" stop-color="#d4e5eb" stop-opacity=".75"/><stop offset="1" stop-color="#c8dfec" stop-opacity="0"/></linearGradient></defs>
        <g class="window-edge" fill="none" stroke="url(#window-light-wide)"><path d="M524 90V700 M1144 90V700"/></g>
        <g class="window-dust" fill="#d7e3e7">
          <circle cx="784" cy="363" r="1.8"/>
          <circle cx="813" cy="391" r="1.2"/>
          <circle cx="828" cy="347" r="1.5"/>
          <circle cx="765" cy="403" r="1.1"/>
          <path d="M805 349l1.3 4.7 3.7 1.3-3.7 1.3-1.3 4.7-1.3-4.7-3.7-1.3 3.7-1.3Z"/>
        </g>
      </svg>
      <svg class="window-invitation window-invitation-tall" viewBox="0 0 941 1672" aria-hidden="true" focusable="false">
        <defs><linearGradient id="window-light-tall" gradientUnits="userSpaceOnUse" x1="0" y1="920" x2="0" y2="45"><stop offset="0" stop-color="#c8dfec" stop-opacity="0"/><stop offset=".48" stop-color="#d4e5eb" stop-opacity=".75"/><stop offset="1" stop-color="#c8dfec" stop-opacity="0"/></linearGradient></defs>
        <g class="window-edge" fill="none" stroke="url(#window-light-tall)"><path d="M190 45V920"/></g>
        <g class="window-dust" fill="#d7e3e7">
          <circle cx="521" cy="475" r="3.5"/>
          <circle cx="567" cy="515" r="2.2"/>
          <circle cx="590" cy="450" r="2.8"/>
          <circle cx="501" cy="535" r="2"/>
          <path d="M547 455l2.2 8.8 6.8 2.2-6.8 2.2-2.2 8.8-2.2-8.8-6.8-2.2 6.8-2.2Z"/>
        </g>
      </svg>
      <button id="room-journal" aria-label="翻开桌上的手记" title="桌上的手记"></button>
    </div>
    <button id="entry-motion" class="entry-motion" aria-pressed="false">轻过渡</button>
  </section>
  <main id="world" aria-label="可探索的文章星空">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div id="star-targets" aria-label="视野内的文章"></div>
    <header class="masthead"><a id="brand" href="#" aria-label="观星者的清醒梦，回到屋顶">
      <svg class="wordmark" viewBox="0 0 460 160" aria-hidden="true" focusable="false">
        <g fill="currentColor" font-family="Baskerville Old Face, Baskerville, Times New Roman, serif" font-weight="400">
          <text x="10" y="63" font-size="68" letter-spacing="-2">Stargazer’s</text>
          <text x="109" y="122" font-size="57" letter-spacing="-2" font-style="italic">Lucid Dream</text>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="1.1" opacity=".8"><path d="M35 64 C12 106 61 122 132 137 S262 158 309 134"/><path d="M122 136 C90 126 77 134 89 145 C101 155 135 151 142 138"/></g>
        <path d="M342 12 L344 24 L353 27 L344 30 L342 42 L340 30 L331 27 L340 24Z M169 132 L170.5 138 L176 140 L170.5 142 L169 148 L167.5 142 L162 140 L167.5 138Z" fill="currentColor"/>
        <circle cx="358" cy="41" r="1.25" fill="currentColor"/>
      </svg>
    </a></header>
    <nav class="navigation" aria-label="探索控制">
      <div class="mode-switch"><button id="relation-mode" aria-pressed="true">关联</button><span>/</span><button id="time-mode" aria-pressed="false">时间</button></div>
      <button id="back" class="icon-control" title="返回上一个停靠点" aria-label="返回上一个停靠点" disabled>↶</button>
      <button id="home" class="icon-control" title="回到屋顶" aria-label="回到屋顶">⌂</button>
    </nav>
    <section id="preview" class="preview" aria-labelledby="preview-title" hidden>
      <div class="preview-meta"><span id="preview-number"></span><span id="preview-date"></span><button id="deselect" aria-label="取消选择">×</button></div>
      <div id="preview-scroll" class="preview-scroll" tabindex="0" role="region" aria-label="文章简介与关联理由">
        <div class="preview-body"><div><span class="eyebrow" id="preview-tag"></span><h2 id="preview-title"></h2></div><p id="preview-intro"></p></div>
        <div id="known-reasons" class="known-reasons"></div>
      </div>
      <div class="preview-bottom"><span id="approach-status"></span><button id="read-button" disabled>进入阅读 <span>→</span></button></div>
    </section>
    <span id="time-cue" class="time-cue" role="status" hidden></span>
    <button id="journal-egg" class="scene-egg" aria-label="翻开屋顶手记" title="翻开屋顶手记">⌑<span>屋顶手记</span></button>
    <button id="signal-egg" class="signal-egg" aria-label="触碰远方信号" title="远方传来一点微光">⌁<span>远方信号</span></button>
    <button id="edge-guide" class="edge-guide" hidden aria-label="沿路径寻找下一颗文章星">›</button><span id="path-legend" class="path-legend">虚线：探索路径</span><footer class="world-footer"><span id="gesture-help">拖动巡视 · 滚轮前行 · 点星靠近</span><span id="journey-label">屋顶 · 夜的起点</span></footer>
  </main>
  <dialog id="reader" aria-labelledby="reader-title"><div class="reading-frame"><header class="reading-header"><span class="reading-site">观星者的清醒梦</span><button id="close-reader">返回星空 <span>↗</span></button></header><div id="reading-scroll" tabindex="0"><article class="article"><div class="article-meta"><span id="reader-date"></span><span id="reader-tag"></span></div><h1 id="reader-title"></h1><p id="reader-intro" class="article-intro"></p><div class="article-rule"></div><div id="reader-content"></div><div class="article-end" id="article-end"><span aria-hidden="true">·</span></div><section class="reading-relations" id="reading-relations"><span class="eyebrow">沿着这颗星，再走一段</span><div id="reader-links"></div></section></article></div><footer class="reading-footer"><span id="reading-state">沿着文字，慢慢往下</span><span id="reading-progress">0%</span></footer></div></dialog>
  <dialog id="egg-dialog"><button class="egg-close" id="close-egg" aria-label="关闭">×</button><span class="eyebrow">A NOTE FROM THE ROOFTOP</span><h2 id="egg-title"></h2><p id="egg-copy"></p><span class="egg-signature">来自这片天空的主人</span></dialog>
  <div id="announcement" class="sr-only" role="status"></div>
  <div class="prototype-tools" id="prototype-tools"><div class="roof-switcher"><label for="roof-style">屋顶</label><select id="roof-style" aria-label="屋顶风格"></select><button id="roof-home" title="回到屋顶比较风格">回屋顶 ↗</button></div><div class="variant-switcher" aria-label="原型方案切换"><span class="prototype-badge">原型</span><button id="prev-variant" aria-label="上一个方案">←</button><span id="variant-label">A · 屋顶入梦</span><button id="next-variant" aria-label="下一个方案">→</button><span class="mock-badge">MOCK</span></div><details class="state-inspector"><summary>状态</summary><pre id="state-output"></pre></details></div>
  <details class="art-study-bar" aria-label="探索路径与星空生长试验"><summary>天空试验 <span>05</span></summary><div class="art-study-controls"><select id="type-choice" aria-label="文字配色"><option value="white">文字 · 素白</option><option value="mist">文字 · 雾灰</option><option value="cool">文字 · 冷白</option></select><select id="art-choice" aria-label="美术配色"></select><button id="living-toggle" aria-pressed="true" title="切换星光微动与鼠标微视差">微动 · 开</button><button id="labels-toggle" aria-pressed="false" title="对照常显标题与按需显露">标题 · 按需</button><button id="paths-toggle" aria-pressed="true">路径 · 开</button><button id="show-specimens">星体样本 ↗</button><button id="show-tools" aria-expanded="false">调试</button><span id="study-caption"></span><fieldset class="growth-controls"><legend>试加 mock 文章</legend><select id="star-rank" aria-label="新文章星等"><option value="ordinary">普通</option><option value="important">重要</option><option value="treasured">珍藏</option></select><label><input type="checkbox" id="star-isolated">保持孤立</label><button id="grow-star">＋ 一篇文章</button><button id="find-new-star" disabled>找刚加的星 ↗</button><button id="export-sky">导出布局</button><p id="growth-status" role="status">仅本次试验；刷新恢复原始天空。可导出坐标保存。</p></fieldset></div></details>
  <dialog id="specimen-dialog" aria-labelledby="specimen-title"><header><div><h2 id="specimen-title">星光的个体差异</h2><p>静态外观比较 · 原始大小与 5 倍细节 · 此处保留静态对照</p></div><button id="close-specimens" aria-label="关闭星体样本">关闭 ×</button></header><canvas id="specimen-canvas" aria-label="四类星体：清冷针点、温暖柔光、微弱双星、明亮主星"></canvas><p class="specimen-note">放大图用于比较结构，页面中的星星保持细小。下方展示不同身份生成的稳定差异。</p></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
