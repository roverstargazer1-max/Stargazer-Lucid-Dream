[build]
  command = "npm run netlify"
  publish = "public"

[build.environment]
  NODE_VERSION = "22.19.0"
  NPM_VERSION = "10.9.3"

# Deploy Previews exercise the same two-theme output as production.
[context.deploy-preview]
  command = "npm run netlify"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/deps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/starry/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The alternate theme has separate scripts and styles; always revalidate them.
[[headers]]
  for = "/legacy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/starfield/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
