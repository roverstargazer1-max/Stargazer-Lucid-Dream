[build]
  command = "npm run netlify"
  publish = "public"

[build.environment]
  NODE_VERSION = "22.19.0"
  NPM_VERSION = "10.9.3"

# Deploy Previews exercise the same two-theme output as production.
[context.deploy-preview]
  command = "npm run netlify"

# Shared by both themes and independent of the asset cache rules below.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/deps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/starry/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The alternate theme has separate scripts and styles; always revalidate them.
[[headers]]
  for = "/legacy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/starfield/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# These filenames contain their font content hash, so updates use a new URL.
[[headers]]
  for = "/fonts/lxgw-marker-chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
